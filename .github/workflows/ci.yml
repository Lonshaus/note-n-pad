name: CI
# Pull requests rather than pushes to work branches: a branch is pushed many
# times while it is being worked on, and only the state that is about to be
# merged has to be green. Pushes to develop and master run too, so the state
# that several merges leave behind is checked as a whole.
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:
# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      # The list lives in scripts/linux-check/apt-packages.txt so this job and
      # the local Linux container (scripts/linux-check/check.sh) install exactly
      # the same packages; two hand-copied lists had already drifted apart once,
      # which quietly makes the container stop standing in for this job.
      # ImageOS and ImageVersion are runner variables, not in the env context.
      - name: Name the runner image (Linux)
        id: image
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore the apt archives (Linux)
        id: apt-archives
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-archives-${{ steps.image.outputs.image }}-${{ hashFiles('scripts/linux-check/apt-packages.txt') }}
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          mkdir -p "$HOME/apt-archives/partial"
          grep -vE '^[[:space:]]*(#|$)' scripts/linux-check/apt-packages.txt \
            | xargs sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-archives"
      # The e2e workflow only restores this; pull requests never save it.
      - name: Save the apt archives (Linux)
        if: startsWith(matrix.os, 'ubuntu') && steps.apt-archives.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-archives-${{ steps.image.outputs.image }}-${{ hashFiles('scripts/linux-check/apt-packages.txt') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci
      # The Tauri CLI refuses to build on an npm/crate major.minor mismatch and no CI step runs it.
      - name: Tauri npm/crate versions
        run: node scripts/check-tauri-versions.mjs
      # rustfmt and clippy are not in the minimal profile this action installs
      # by default, so both are requested explicitly.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Needs no compilation, so it runs before the build cache is even restored.
      - name: Rust format check (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      # tauri-build refuses to compile without the index, and the vitest and
      # cargo tests read it.
      - name: Generate third-party licence index
        run: |
          cargo install cargo-bundle-licenses --version 4.2.0 --locked
          npm run licenses

      - name: Type check (svelte-check + tsc)
        run: npm run check

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Format check (prettier)
        run: npm run format:check
      # tauri-build fails without the helper that tauri.windows.conf.json lists
      # as an external binary, so it is built before any cargo run in the app's
      # crate. A target that is not Windows needs none and the script returns.
      - name: Build the clipboard helper
        run: node scripts/build-cliphelper.mjs
      # The same debug build the E2E prebuild needs, so the saved cache holds it.
      - name: Build the app (debug)
        working-directory: src-tauri
        run: cargo build

      - name: Rust tests (cargo test)
        working-directory: src-tauri
        run: cargo test

      - name: Clipboard helper tests (cargo test)
        working-directory: src-tauri/cliphelper
        run: cargo test

      - name: Clipboard helper lint (cargo clippy)
        working-directory: src-tauri/cliphelper
        run: cargo clippy --all-targets -- -D warnings
      # Runs on all three platforms deliberately: most of the platform-specific
      # code is behind #[cfg(target_os = ...)], so a lint that only ran on one
      # runner would never compile the other two platforms' branches at all.
      - name: Rust lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
