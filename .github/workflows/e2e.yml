name: E2E

# Manual trigger, like ci.yml: every suite builds the app, launches it, and
# drives the real UI, so a full run is tens of minutes.
#
# No Windows job: scripts/e2e/lib.sh resolves the app-data directory and the
# WebView process name for Darwin and Linux only.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suite names, space separated, e.g. "e2e-table e2e-large". Empty runs all.'
        required: false
        default: ''
      runners:
        description: Which runners to use. A failure that shows on both costs ten times more to reproduce on macOS.
        required: false
        default: both
        type: choice
        options:
          - both
          - ubuntu
          - macos

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # A job-level `if` cannot see the matrix context, and guarding every
        # step is worse, so the matrix itself is what shrinks.
        os: >-
          ${{ fromJSON(inputs.runners == 'ubuntu' && '["ubuntu-24.04"]'
          || inputs.runners == 'macos' && '["macos-latest"]'
          || '["ubuntu-24.04","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' scripts/linux-check/apt-packages.txt \
            | xargs sudo apt-get install -y
          sudo apt-get install -y xvfb lsof jq

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Each suite waits for the automation socket on its own timeout; on a cold
      # cache that wait would be racing a full compile.
      - name: Prebuild the app
        working-directory: src-tauri
        run: cargo build

      - name: Run the E2E suites
        env:
          # Through the environment, never interpolated into the script.
          SUITES: ${{ inputs.suites }}
        run: |
          set -u -o pipefail
          if [ -z "$SUITES" ]; then
            scripts="$(ls scripts/e2e/e2e-*.sh)"
          else
            scripts=""
            for name in $SUITES; do
              case "$name" in
                e2e-*[!a-z0-9-]*) echo "rejected: $name" >&2; exit 1 ;;
                e2e-*) ;;
                *) echo "rejected: $name" >&2; exit 1 ;;
              esac
              [ -f "scripts/e2e/$name.sh" ] || { echo "no such suite: $name" >&2; exit 1; }
              scripts="$scripts scripts/e2e/$name.sh"
            done
          fi

          # WebKitGTK wants a GPU and an accessibility bus the runner has not got.
          if [ "$RUNNER_OS" = Linux ]; then
            export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 NO_AT_BRIDGE=1
            runner="xvfb-run --auto-servernum"
          else
            runner=""
          fi

          mkdir -p e2e-logs
          failed=""
          for s in $scripts; do
            name="$(basename "$s" .sh)"
            echo "::group::$name"
            start=$(date +%s)
            if $runner "$s" 2>&1 | tee "e2e-logs/$name.log"; then
              result=PASS
            else
              result=FAIL
              failed="$failed $name"
            fi
            echo "$name $result $(( $(date +%s) - start ))s" >>e2e-logs/summary.txt
            echo "::endgroup::"
          done

          cat e2e-logs/summary.txt >>"$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ] || { echo "failed:$failed" >&2; exit 1; }

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e-logs/
          retention-days: 7
