name: E2E
# Automatic on pull requests into master only, where a merge means a version
# is being released. Everywhere else it stays on demand.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suites:
        # Single-select, because GitHub dropdowns are. The run step still
        # validates the name: an API dispatch can send any string it likes.
        description: Which suite to run.
        required: false
        default: all
        type: choice
        options:
          - all
          - e2e-clip
          - e2e-close-flush
          - e2e-editor-focus
          - e2e-file-drop
          - e2e-global-edit
          - e2e-goto
          - e2e-highlight
          - e2e-i18n
          - e2e-large
          - e2e-longline
          - e2e-paste
          - e2e-range
          - e2e-select-all
          - e2e-spill
          - e2e-table
          - e2e-view-mode
          - e2e-windowed
          - e2e-windowed-two-tabs
      runners:
        # A failure on one platform is far cheaper to reproduce than one that
        # needs all three.
        description: Which runners to use.
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suites' limits below add up to 295 minutes, their 60 s grace periods
    # to 18, and installing and building takes about 20.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # A job-level `if` cannot see the matrix context, and guarding every
        # step is worse, so the matrix itself is what shrinks.
        os: >-
          ${{ fromJSON(inputs.runners == 'ubuntu' && '["ubuntu-24.04"]'
          || inputs.runners == 'macos' && '["macos-latest"]'
          || inputs.runners == 'windows' && '["windows-latest"]'
          || '["ubuntu-24.04","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' scripts/linux-check/apt-packages.txt \
            | xargs sudo apt-get install -y
          sudo apt-get install -y xvfb lsof jq

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build refuses to compile without the index.
      - name: Generate third-party licence index
        run: |
          cargo install cargo-bundle-licenses --version 4.2.0 --locked
          npm run licenses
      # tauri-build fails without the clipboard helper on Windows.
      - name: Build the clipboard helper
        run: node scripts/build-cliphelper.mjs
      # Each suite waits for the automation socket on its own timeout; on a cold
      # cache that wait would be racing a full compile.
      - name: Prebuild the app
        working-directory: src-tauri
        run: cargo build

      - name: Run the E2E suites
        # Windows runners default to PowerShell, and this script is POSIX.
        shell: bash
        env:
          # Through the environment, never interpolated into the script.
          SUITES: ${{ inputs.suites }}
        run: |
          set -u -o pipefail
          # The dropdown's "all" option and an API dispatch's empty string both mean everything.
          if [ "$SUITES" = all ]; then
            SUITES=''
          fi
          if [ -z "$SUITES" ]; then
            scripts="$(ls scripts/e2e/e2e-*.sh)"
          else
            scripts=""
            for name in $SUITES; do
              case "$name" in
                e2e-*[!a-z0-9-]*) echo "rejected: $name" >&2; exit 1 ;;
                e2e-*) ;;
                *) echo "rejected: $name" >&2; exit 1 ;;
              esac
              [ -f "scripts/e2e/$name.sh" ] || { echo "no such suite: $name" >&2; exit 1; }
              scripts="$scripts scripts/e2e/$name.sh"
            done
          fi
          # WebKitGTK wants a GPU and an accessibility bus the runner has not got.
          if [ "$RUNNER_OS" = Linux ]; then
            export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 NO_AT_BRIDGE=1
            runner="xvfb-run --auto-servernum"
          else
            runner=""
          fi
          # Minutes each suite may run, from measured run times with room to spare.
          minutes_for() {
            case "$1" in
              e2e-close-flush | e2e-editor-focus | e2e-file-drop | e2e-goto | e2e-highlight | e2e-i18n | e2e-large | e2e-longline | e2e-range | e2e-windowed-two-tabs) echo 10 ;;
              e2e-table | e2e-view-mode | e2e-windowed | e2e-clip | e2e-spill) echo 15 ;;
              e2e-select-all) echo 30 ;;
              e2e-global-edit | e2e-paste) echo 45 ;;
              *) return 1 ;;
            esac
          }
          for s in $scripts; do
            minutes_for "$(basename "$s" .sh)" >/dev/null \
              || { echo "no time limit for $s in minutes_for" >&2; exit 1; }
          done
          # A suite that outlives its limit gets SIGTERM, and SIGKILL for its
          # whole process group after the grace period: the suites trap TERM,
          # tidy up, and then do not end.
          grace=60
          if [ "$RUNNER_OS" != Windows ]; then
            # timeout sends no KILL once its direct child (xvfb-run) is gone; macOS has none.
            cat >"$RUNNER_TEMP/limit.pl" <<'PERL'
          use strict;
          use warnings;
          use POSIX qw(:sys_wait_h);
          my ($limit, $grace, @cmd) = @ARGV;
          my $pid = fork();
          die "fork: $!" unless defined $pid;
          if ($pid == 0) {
            setpgrp(0, 0);
            exec @cmd or die "exec: $!";
          }
          setpgrp($pid, $pid);
          my $start = time;
          my ($termed, $killed, $status) = (0, 0, 0);
          while (1) {
            if (waitpid($pid, WNOHANG) == $pid) {
              $status = $?;
              last;
            }
            my $waited = time - $start;
            if (!$termed && $waited >= $limit) {
              kill 'TERM', -$pid;
              $termed = $waited;
            }
            if ($termed && !$killed && $waited >= $termed + $grace) {
              kill 'KILL', -$pid;
              $killed = 1;
            }
            select(undef, undef, undef, 0.2);
          }
          if ($termed) {
            # The leader can be gone while the suite it started still tidies up.
            while (!$killed && kill(0, -$pid) && time - $start < $termed + $grace) {
              select(undef, undef, undef, 0.2);
            }
            if (kill(0, -$pid)) {
              kill 'KILL', -$pid;
              $killed = 1;
            }
            exit($killed ? 137 : 124);
          }
          exit(($status & 127) ? 128 + ($status & 127) : $status >> 8);
          PERL
            limited() { local secs="$1"; shift; perl "$RUNNER_TEMP/limit.pl" "$secs" "$grace" "$@"; }
          else
            limited() { local secs="$1"; shift; timeout -k "$grace" -s TERM "$secs" "$@"; }
          fi

          mkdir -p e2e-logs
          # The app's own output goes to $OUT/dev-<suite>.log, which is outside
          # the upload path; without it a failed launch shows only the socket
          # refusing connections. $OUT also holds the multi-hundred-MB fixtures,
          # so copy the logs out rather than uploading the directory.
          out="$(bash -c '. scripts/e2e/lib.sh; printf %s "$OUT"')"
          failed=""
          for s in $scripts; do
            name="$(basename "$s" .sh)"
            limit=$(( $(minutes_for "$name") * 60 ))
            echo "::group::$name"
            start=$(date +%s)
            code=0
            limited "$limit" $runner "$s" 2>&1 | tee "e2e-logs/$name.log" || code=${PIPESTATUS[0]}
            elapsed=$(( $(date +%s) - start ))
            case "$code" in
              0) result=PASS ;;
              # 137 is also a kill from outside the limit, such as the OOM killer.
              124 | 137)
                if [ "$elapsed" -ge "$limit" ]; then
                  result=TIMEOUT
                else
                  result=FAIL
                fi
                ;;
              *) result=FAIL ;;
            esac
            [ "$result" = PASS ] || failed="$failed $name"
            echo "$name $result ${elapsed}s" >>e2e-logs/summary.txt
            # Kept at once, so a later suite that hangs cannot lose it.
            cp "$out"/dev-*.log e2e-logs/ 2>/dev/null || true
            echo "::endgroup::"
          done

          cat e2e-logs/summary.txt >>"$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ] || { echo "failed:$failed" >&2; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e-logs/
          retention-days: 7
