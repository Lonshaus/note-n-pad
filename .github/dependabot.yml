# Version bumps only. Dependabot alerts for known vulnerabilities are a
# separate repository setting and are not configured here.
#
# Twice a month, on the 1st and 15th, rather than weekly: this is a desktop app
# with no server surface, so a dependency being a few weeks behind costs
# nothing, while a weekly cadence across three ecosystems opens more pull
# requests than the project can review.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Asia/Tokyo'
    # svelte-check fails under TypeScript 7. Drop this once it supports 7.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The manifest lives beside the Rust crate, not at the repository root.
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Asia/Tokyo'

  # dtolnay/rust-toolchain is pinned to a branch, so Dependabot leaves it
  # alone; the rest are tag pins and do get bumped.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Asia/Tokyo'
